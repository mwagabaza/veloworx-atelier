<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="100" fill="#14140f"/>
  <g transform="translate(256 256)">
    <!-- Outer Gear Ring with teeth -->
    <circle r="190" fill="none" stroke="#E63946" stroke-width="16"/>
    <!-- 12 Gear teeth -->
    <g fill="#E63946">
      <rect x="-12" y="-225" width="24" height="40" rx="4"/>
      <rect x="-12" y="-225" width="24" height="40" rx="4" transform="rotate(30)"/>
      <rect x="-12" y="-225" width="24" height="40" rx="4" transform="rotate(60)"/>
      <rect x="-12" y="-225" width="24" height="40" rx="4" transform="rotate(90)"/>
      <rect x="-12" y="-225" width="24" height="40" rx="4" transform="rotate(120)"/>
      <rect x="-12" y="-225" width="24" height="40" rx="4" transform="rotate(150)"/>
      <rect x="-12" y="-225" width="24" height="40" rx="4" transform="rotate(180)"/>
      <rect x="-12" y="-225" width="24" height="40" rx="4" transform="rotate(210)"/>
      <rect x="-12" y="-225" width="24" height="40" rx="4" transform="rotate(240)"/>
      <rect x="-12" y="-225" width="24" height="40" rx="4" transform="rotate(270)"/>
      <rect x="-12" y="-225" width="24" height="40" rx="4" transform="rotate(300)"/>
      <rect x="-12" y="-225" width="24" height="40" rx="4" transform="rotate(330)"/>
    </g>
    <!-- Inner Chainring cutouts -->
    <circle r="140" fill="none" stroke="#E63946" stroke-width="12"/>
    <!-- 5 Spoke chainring holes -->
    <circle cx="0" cy="-90" r="28" fill="#14140f"/>
    <circle cx="0" cy="-90" r="28" fill="#14140f" transform="rotate(72)"/>
    <circle cx="0" cy="-90" r="28" fill="#14140f" transform="rotate(144)"/>
    <circle cx="0" cy="-90" r="28" fill="#14140f" transform="rotate(216)"/>
    <circle cx="0" cy="-90" r="28" fill="#14140f" transform="rotate(288)"/>
    <!-- Center axle hub -->
    <circle r="45" fill="#E63946"/>
    <circle r="22" fill="#14140f"/>
  </g>
</svg>
